# ==============================================================================
# RepVote Configuration File
# Integrated Pipeline for Repetitive Element Quantification
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Project Input Settings
# ------------------------------------------------------------------------------
# The unified sample sheet (Supports both Local and GSM/SRA samples)
samples_file: "config/samples.tsv"

# ------------------------------------------------------------------------------
# 2. Directory Structure (Relative Paths)
# ------------------------------------------------------------------------------
paths:
  # Where final count matrices and QC reports go
  results: "data"
  
  # Where raw downloads and intermediate FASTQ files go
  data: "data"

  # Where Snakemake writes performance logs (CPU/RAM usage)
  benchmarks: "benchmarks"
  
  # Location for custom .sif files (if not using docker://)
  containers: "resources/containers"

# ------------------------------------------------------------------------------
# 3. Reference Resources (User Must Provide)
# ------------------------------------------------------------------------------
resources:
  # The Reference Genome (FASTA)
  genome_fasta: "resources/chm13v2.0.fa"
  
  # The Repeat Annotation (BED)
  # Format: No Header, 0-based: [Chr, start, end, subfamily#Class/Family]
  repeat_bed: "resources/chm13v2.0_RepeatMasker_4.1.2p1.2022Apr14_converted.bed"
  
  # The Transcriptome (GTF)
  # Used to filter out k-mers that match canonical genes (preventing false positives)
  genome_gtf: "resources/CHM13_2305290852_hs1.ncbiRefSeq.gtf"

  # For kallisto
  kallisto:
    fragment_len: 200 # For Single-End only
    fragment_sd: 20

# ------------------------------------------------------------------------------
# 4. Index Generation & Quantification Settings
# ------------------------------------------------------------------------------
# These settings control how the unique k-mer database is constructed and quantified.
indexing:
  kmer_len: 24
  no_transcript_filter: false
  outputs:
    final_fasta: "resources/index/final_fasta"
  generated_transcriptome: "resources/transcriptome.fa"

quantification:  
  repeat_index_path: "resources/repeat_index.idx"
  min_kmer_matches: 1
  export_assignments: false
  tx2gene: "resources/tx2gene.tsv"

# ------------------------------------------------------------------------------
# 5. Container Definitions
# ------------------------------------------------------------------------------
docker_images:
  fastqc:      "docker://biocontainers/fastqc:v0.11.9_cv8"
  fastp:       "docker://biocontainers/fastp:v0.20.1_cv1"
  multiqc:     "docker://quay.io/biocontainers/multiqc:1.31--pyhdfd78af_0"
  kallisto:    "docker://quay.io/biocontainers/kallisto:0.51.1--h2b92561_2"
  base_unix:   "docker://ubuntu:20.04"
  gawk:        "docker://quay.io/biocontainers/gawk:5.3.1"
  gffread:     "docker://quay.io/biocontainers/cufflinks:2.2.1--py36_2"
  r_tximport:  "docker://quay.io/biocontainers/bioconductor-tximport:1.34.0--r44hdfd78af_0"

  # -- Custom Tools --
  gsm_fetcher: "docker://hokawa1135/gsm-fetcher:1.0.0"
  repeatquant: "resources/containers/repeat_counter/repeatquant.sif"

# ------------------------------------------------------------------------------
# 6. Resource Management
# ------------------------------------------------------------------------------
resource_profiles:
  light:
    threads: 1
    mem_mb: 4000
  
  standard:
    threads: 4
    mem_mb: 7000
  
  heavy:
    threads: 8
    mem_mb: 14000
    
  extreme:
    threads: 16
    mem_mb: 94000

  io_bound_for_esearch: 1
  io_bound_for_prefetch: 1
