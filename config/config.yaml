# ==============================================================================
# RepVote Configuration File
# Integrated Pipeline for Repetitive Element Quantification
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Project Input Settings
# ------------------------------------------------------------------------------
# The unified sample sheet (Supports both Local and GSM/SRA samples)
samples_file: "config/samples.tsv"

# ------------------------------------------------------------------------------
# 2. Directory Structure (Relative Paths)
# ------------------------------------------------------------------------------
paths:
  # Where final count matrices and QC reports go
  results: "data"
  
  # Where raw downloads and intermediate FASTQ files go
  data: "data"
  
  # Where Snakemake writes performance logs (CPU/RAM usage)
  benchmarks: "benchmarks"
  
  # Location for custom .sif files (if not using docker://)
  containers: "resources/containers"

# ------------------------------------------------------------------------------
# 3. Reference Resources (User Must Provide)
# ------------------------------------------------------------------------------
resources:
  # The Reference Genome (FASTA)
  genome_fasta: ".test/resources/genome_mock.fa"
  
  # The Repeat Annotation (BED)
  # Format: No Header, 0-based: [Chr, start, end, subfamily#Class/Family]
  repeat_bed: ".test/resources/repeats_mock.bed"
  
  # The Transcriptome (GTF)
  # Used to filter out k-mers that match canonical genes (preventing false positives)
  genome_gtf: ".test/resources/transcripts_mock.gtf"

  #For kallisto
  kallisto:
    fragment_len: 200 # For Single-End only
    fragment_sd: 20

# ------------------------------------------------------------------------------
# 4. Index Generation Settings (RepVote Build)
# ------------------------------------------------------------------------------
# These settings control how the unique k-mer database is constructed.
indexing:
  kmer_len: 24
  
  # Jellyfish hash size
  hash_size: "1G"       

  # --- Internal Pipeline Outputs (Do not modify unless customizing logic) ---
  # All indices will be built inside 'resources/index/'
  base_dir: "resources/index"
  
  outputs:
    step_01_bed_split:       "resources/index/01_bed_split"
    step_02_fasta_type:      "resources/index/02_fasta_type"
    step_03_masked_genome:   "resources/index/03_masked_genome/masked.fasta"
    step_04_split_chrom:     "resources/index/04_split_chromosomes"
    step_05_chrom_counts:    "resources/index/05_chrom_counts"
    step_06_genome_kmers:    "resources/index/06_genome_nonrepeat_kmers.txt"
    step_07_genome_db:       "resources/index/07_genome_kmers.parquet"
    step_08_repeat_counts:   "resources/index/08_repeat_counts"
    step_09_global_db:       "resources/index/09_global_counts.parquet"
    step_10_unique_repeat:   "resources/index/10_unique_kmer_type"
    step_11_genomic_removed: "resources/index/11_genomic_removed_kmers"
    step_12_trans_txt:       "resources/index/12_transcript_kmers/kmers.txt"
    step_13_trans_db:        "resources/index/13_transcript_kmers.parquet"
    step_14_final_fasta:     "resources/index/14_final_unique_kmers" # <--- The Primary Index Output
    step_15_summary:         "resources/index/15_removal_summary.tsv"
    step_16_cleanup_done:    "resources/index/16_cleanup.done"
  
  generated_transcriptome: "resources/transcriptome.fa"

quantification:  
  repeat_index_path: "resources/repeat_index.idx"
  
  #Kallisto
  tx2gene: "resources/tx2gene.tsv"

# ------------------------------------------------------------------------------
# 5. Container Definitions
# ------------------------------------------------------------------------------
# RepVote is designed to run with Apptainer/Singularity.
# - 'docker://' URLs will be automatically pulled and converted to .sif.
# - Local paths (resources/containers/...) are for your custom tools.

docker_images:
  # -- Public Tools --
  fastqc:      "docker://biocontainers/fastqc:v0.11.9_cv8"
  fastp:       "docker://biocontainers/fastp:v0.20.1_cv1"
  multiqc:     "docker://quay.io/biocontainers/multiqc:1.31--pyhdfd78af_0"
  kallisto:    "docker://quay.io/biocontainers/kallisto:0.51.1--h2b92561_2"
  bedtools:    "docker://quay.io/biocontainers/bedtools:2.31.1--h13024bc_3"
  jellyfish:   "docker://quay.io/biocontainers/kmer-jellyfish:2.3.1--py39pl5321h2de1943_6"
  base_unix:   "docker://ubuntu:20.04"
  gawk:        "docker://quay.io/biocontainers/gawk:5.3.1"
  gffread: "docker://quay.io/biocontainers/cufflinks:2.2.1--py36_2"
  kallisto:    "docker://quay.io/biocontainers/kallisto:0.51.1--h2b92561_2"
  r_tximport:  "docker://quay.io/biocontainers/bioconductor-tximport:1.34.0--r44hdfd78af_0"
  pand: "docker://amancevice/pandas:alpine"

  # -- Custom Tools --
  gsm_fetcher: "docker://hokawa1135/gsm-fetcher:1.0.0"
  r_scripting: "docker://hokawa1135/artemis-r:1.0.0"
  repeatquant: "docker://hokawa1135/repeatquant:1.0.0"
  duckdb:      "docker://hokawa1135/customduckdb:0.5.1"

# ------------------------------------------------------------------------------
# 6. Resource Management (User-Configurable)
# ------------------------------------------------------------------------------
# Adjust these based on your machine. 
# "heavy" is for Jellyfish/Kallisto (prevents OOM by limiting concurrency).
resource_profiles:
  standard:
    threads: 4
    mem_mb: 4000     # 4 GB
  
  heavy:
    threads: 16      # High threads = Fewer parallel jobs = Safer RAM
    mem_mb: 32000    # 32 GB (Advises scheduler)
    
  extreme:
    threads: 24
    mem_mb: 64000

  io_bound_for_esearch: 1
  io_bound_for_prefetch: 1
